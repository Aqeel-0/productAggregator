<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AggreMart - Product Data Pipeline</title>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="topbar">
    <div class="topbar-left">
      <div class="brand">
        <i class="fas fa-layer-group brand-icon"></i>
        <span class="brand-name">AggreMart</span>
      </div>
      <span class="brand-divider"></span>
      <span class="brand-sub">Data Pipeline</span>
    </div>
    <div class="topbar-right">
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode">
        <i class="fas fa-moon"></i>
      </button>
      <div class="conn-badge" id="connectionStatus">
        <span class="conn-dot"></span>
        <span id="connectionText">Connecting...</span>
      </div>
      <div class="topbar-clock">
        <i class="far fa-clock"></i>
        <span id="systemTime">--:--:--</span>
      </div>
    </div>
  </nav>

  <main class="main-content">

    <!-- Pipeline Overview -->
    <section class="pipeline-section">
      <div class="pipeline-step" data-step="collect">
        <div class="step-icon"><i class="fas fa-download"></i></div>
        <div class="step-body">
          <div class="step-label">Collect</div>
          <div class="step-desc">Gather product data from websites</div>
        </div>
        <div class="step-stat" id="pipelineRawCount">0 products</div>
      </div>
      <div class="pipeline-arrow"><i class="fas fa-chevron-right"></i></div>
      <div class="pipeline-step" data-step="process">
        <div class="step-icon"><i class="fas fa-wand-magic-sparkles"></i></div>
        <div class="step-body">
          <div class="step-label">Process</div>
          <div class="step-desc">Clean &amp; standardize the data</div>
        </div>
        <div class="step-stat" id="pipelineNormCount">0 products</div>
      </div>
      <div class="pipeline-arrow"><i class="fas fa-chevron-right"></i></div>
      <div class="pipeline-step" data-step="store">
        <div class="step-icon"><i class="fas fa-database"></i></div>
        <div class="step-body">
          <div class="step-label">Store</div>
          <div class="step-desc">Save to database for use</div>
        </div>
        <div class="step-stat" id="pipelineDbCount">0 products</div>
      </div>
    </section>

    <!-- Quick Actions -->
    <section class="actions-bar">
      <button class="action-btn action-collect" onclick="startAllScrapers()">
        <i class="fas fa-rocket"></i> Collect All
      </button>
      <button class="action-btn action-process" onclick="normalizeAll()">
        <i class="fas fa-wand-magic-sparkles"></i> Process All
      </button>
      <button class="action-btn action-store" onclick="insertToDatabase()">
        <i class="fas fa-database"></i> Store All
      </button>
      <button class="action-btn action-pipeline" onclick="runCompletePipeline()">
        <i class="fas fa-play"></i> Run Full Pipeline
      </button>
      <button class="action-btn action-delete" onclick="clearAllData()">
        <i class="fas fa-trash-can"></i> Delete All Data
      </button>
    </section>

    <!-- Platform Cards (generated by JS) -->
    <section class="platforms-grid" id="platformsGrid"></section>

    <!-- Activity Log -->
    <section class="log-section">
      <div class="log-header">
        <h3><i class="fas fa-terminal"></i> Activity Log</h3>
        <div class="log-controls">
          <button class="filter-pill active" data-filter="all" onclick="filterLogs('all', this)">All</button>
          <button class="filter-pill" data-filter="info" onclick="filterLogs('info', this)">Info</button>
          <button class="filter-pill" data-filter="success" onclick="filterLogs('success', this)">Success</button>
          <button class="filter-pill" data-filter="warning" onclick="filterLogs('warning', this)">Warnings</button>
          <button class="filter-pill" data-filter="error" onclick="filterLogs('error', this)">Errors</button>
          <button class="clear-log-btn" onclick="clearLogs()" title="Clear logs"><i class="fas fa-trash-can"></i></button>
        </div>
      </div>
      <div class="log-body" id="activityLog"></div>
    </section>

  </main>

  <!-- Configuration Modal -->
  <div class="modal-overlay" id="configModal">
    <div class="modal-dialog">
      <div class="modal-head">
        <h3><i class="fas fa-sliders"></i> <span id="modalPlatformName"></span> Settings</h3>
        <button class="modal-x" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-save" onclick="saveConfig()"><i class="fas fa-check"></i> Save Settings</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="app.js"></script>
</body>
</html>
